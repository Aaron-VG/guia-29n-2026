<style>
:root{
  /* Layout idea: a civic reference binder. Sticky tab rail, one reading column, ballot-paper cards (white = Congreso, sepia = Senado). */
  --paper:#f3f5f7; --card:#ffffff; --ink:#15213a; --muted:#56627a; --line:#d5dbe4;
  --accent:#0c6b6b; --accent-ink:#ffffff; --sepia:#b58f52; --soft:#e7ecf1;
  --ok:#1f7a4d; --warn:#a8650a; --none:#7a8296;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10151f; --card:#18202d; --ink:#e8ecf3; --muted:#a2adc2; --line:#2c3748;
    --accent:#4fc0bd; --accent-ink:#06201f; --sepia:#d2ad6e; --soft:#212b3a;
    --ok:#5fd09a; --warn:#f0b35a; --none:#98a2b6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10151f; --card:#18202d; --ink:#e8ecf3; --muted:#a2adc2; --line:#2c3748;
  --accent:#4fc0bd; --accent-ink:#06201f; --sepia:#d2ad6e; --soft:#212b3a;
  --ok:#5fd09a; --warn:#f0b35a; --none:#98a2b6; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:3px solid var(--sepia);outline-offset:2px}
header.top{background:var(--card);border-bottom:1px solid var(--line)}
.wrap{max-width:1060px;margin:0 auto;padding:0 16px}
.brand{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;padding:20px 0 14px}
.brand h1{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,4.5vw,2.4rem);line-height:1.05;margin:0;text-wrap:balance}
.brand p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.lang{display:flex;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--paper)}
.lang button{border:0;background:transparent;color:var(--ink);font:600 .85rem var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-top:6px;padding-bottom:6px}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;padding:8px 12px;border-radius:8px}
nav.tabs a[aria-current="page"]{background:var(--soft);color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
main{padding:24px 0 64px}
h2{font-family:var(--display);font-size:1.55rem;line-height:1.15;margin:0 0 6px;text-wrap:balance}
h3{font-family:var(--display);font-size:1.15rem;margin:0;text-wrap:balance}
.lede{color:var(--muted);max-width:65ch;margin:0 0 20px}
.grid{display:grid;gap:14px}
.facts{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.fact{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:6px;padding:12px 14px}
.fact.sen{border-left-color:var(--sepia)}
.ballot{border-top:6px solid var(--accent)}.ballot.sen{border-top-color:var(--sepia)}
table td,table th{font-variant-numeric:tabular-nums}
.fact b{display:block;font-family:var(--display);font-size:1.25rem;font-variant-numeric:tabular-nums}
.fact span{color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.note{background:var(--soft);border-radius:8px;padding:12px 14px;font-size:.93rem}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.93rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
tr:last-child td{border-bottom:0}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:8px;vertical-align:baseline}
.pill{display:inline-block;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.pill.pub{color:var(--ok)} .pill.pend{color:var(--warn)} .pill.no{color:var(--none)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:500 .88rem var(--body);padding:6px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.phead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}
.phead h3{font-size:1.45rem}
.meta{color:var(--muted);font-size:.92rem;margin:4px 0 0;max-width:70ch}
.topic{padding:14px 0;border-bottom:1px dashed var(--line)}
.topic:last-child{border-bottom:0}
.topic h4{margin:0 0 6px;font:600 1rem var(--body)}
ul.props{margin:0;padding-left:0;list-style:none;display:grid;gap:7px}
ul.props li{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;max-width:78ch}
.tag{font:600 .68rem var(--body);letter-spacing:.04em;border-radius:4px;padding:2px 5px;margin-top:3px;min-width:22px;text-align:center}
.tag.P{background:var(--ok);color:var(--card)} .tag.A{background:var(--sepia);color:var(--card)} .tag.D{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.empty{color:var(--none);font-style:italic;font-size:.93rem}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{display:inline-block;text-decoration:none;font-weight:600;font-size:.85rem;border:1.5px solid var(--accent);color:var(--accent);padding:5px 10px;border-radius:6px}
.btn.solid{background:var(--accent);color:var(--accent-ink)}
.btn.q{border-style:dashed}
button.btn{cursor:pointer;font-family:var(--body)}
.vid{display:block;width:100%;max-width:340px;aspect-ratio:9/16;border-radius:12px;border:1px solid var(--line);background:var(--soft);margin-top:12px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.88rem;color:var(--muted);margin:10px 0 18px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.col2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.pc h4{margin:0 0 8px;font:600 1rem var(--body)}
.time{list-style:none;margin:0;padding:0;display:grid;gap:0}
.time li{display:grid;grid-template-columns:118px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.time li.past{opacity:.62}
.time time{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.time small{display:block;color:var(--muted)}
.bars{display:grid;gap:9px;margin:10px 0}
.bar{display:grid;grid-template-columns:110px 1fr 58px;gap:10px;align-items:center;font-size:.92rem}
.bar i{display:block;height:18px;border-radius:3px;background:var(--accent)}
.bar .track{background:var(--soft);border-radius:3px}
.bar b{font-variant-numeric:tabular-nums;text-align:right}
ul.src{margin:0;padding-left:18px;display:grid;gap:6px;font-size:.93rem}
footer{color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding:18px 0 40px}
@media (max-width:480px){.time li{grid-template-columns:1fr;gap:2px}.bar{grid-template-columns:84px 1fr 50px}}
</style>

  ["D","Préstamos ICO sin intereses de hasta el 20 % del precio (máximo 50.000 €) para la primera vivienda.","Préstecs ICO sense interessos de fins al 20 % del preu (màxim 50.000 €) per al primer habitatge.","Interest-free ICO loans of up to 20% of the price (max €50,000) for a first home."],
  ["D","Gran empresa pública de vivienda y parque público por encima del 6 % del total; Plan Estatal 2026-2030 con 7.000 millones.","Gran empresa pública d'habitatge i parc públic per sobre del 6 % del total; Pla Estatal 2026-2030 amb 7.000 milions.","A large public housing company and public stock above 6% of the total; 2026-2030 State Plan worth €7bn."],

  ["D","Aprobar un Estatuto del Becario.","Aprovar un Estatut del Becari.","Pass an Interns' Statute."],
  ["P","Más ayudas y protección social para los autónomos, sin cifras concretadas.","Més ajuts i protecció social per als autònoms, sense xifres concretades.","More aid and social protection for the self-employed, with no figures specified."]],
 sanidad:[["A","Esperas máximas de 120 días para operarse, 60 para el especialista y 30 para pruebas (programa de 2023).","Esperes màximes de 120 dies per operar-se, 60 per a l'especialista i 30 per a proves (programa del 2023).","Maximum waits of 120 days for surgery, 60 for a specialist and 30 for tests (2023 programme)."],
  ["D","Recuperar la ley de gestión pública del Sistema Nacional de Salud, que limita los conciertos y decayó con la disolución.","Recuperar la llei de gestió pública del Sistema Nacional de Salut, que limita els concerts i va decaure amb la dissolució.","Revive the public-management health bill, which limits outsourcing and lapsed when parliament was dissolved."]],
 educacion:[["D","Máximo de 22 alumnos por aula en Primaria y 25 en ESO (proyecto decaído).","Màxim de 22 alumnes per aula a Primària i 25 a l'ESO (projecte decaigut).","Class-size caps of 22 in primary and 25 in lower secondary (lapsed bill)."],
  ["A","Matrícula universitaria y de FP gratuita para quien aprueba a la primera; plazas públicas gratuitas de 0 a 3 años de forma gradual (2023).","Matrícula universitària i d'FP gratuïta per a qui aprova a la primera; places públiques gratuïtes de 0 a 3 anys de manera gradual (2023).","Free university and vocational tuition for credits passed first time; free public 0–3 places phased in (2023)."]],
 energia:[["D","81 % de electricidad renovable en 2030 según el plan de energía y clima, con cierre ordenado de las nucleares; Almaraz autorizada hasta junio de 2030.","81 % d'electricitat renovable el 2030 segons el pla d'energia i clima, amb tancament ordenat de les nuclears; Almaraz autoritzada fins al juny del 2030.","81% renewable electricity by 2030 under the energy and climate plan, with an orderly nuclear phase-out; Almaraz licensed until June 2030."],
  ["D","Pacto de Estado frente a la emergencia climática.","Pacte d'Estat davant l'emergència climàtica.","A cross-party pact on the climate emergency."]],
 territorial:[["D","Nuevo modelo de financiación autonómica: 20.975 millones más en 2027 y cesión del 55 % del IRPF y el 56,5 % del IVA; requiere mayoría absoluta en la próxima legislatura.","Nou model de finançament autonòmic: 20.975 milions més el 2027 i cessió del 55 % de l'IRPF i el 56,5 % de l'IVA; requereix majoria absoluta a la pròxima legislatura.","New regional financing model: €20.975bn more in 2027 and transfer of 55% of income tax and 56.5% of VAT; needs an absolute majority next term."],
  ["D","Condonación de 83.252 millones de deuda autonómica (proyecto decaído) y defensa de la amnistía.","Condonació de 83.252 milions de deute autonòmic (projecte decaigut) i defensa de l'amnistia.","Write-off of €83.252bn of regional debt (lapsed bill) and defence of the amnesty."],
  ["D","El PSC abrió campaña presentándose como garante del autogobierno y de la lengua catalana.","El PSC va obrir campanya presentant-se com a garant de l'autogovern i de la llengua catalana.","PSC opened its campaign presenting itself as guarantor of self-government and the Catalan language."]],
 infra:[["D","Abono único estatal de transporte de 60 € al mes (30 € para menores de 26), en vigor desde enero de 2026.","Abonament únic estatal de transport de 60 € al mes (30 € per a menors de 26), en vigor des del gener del 2026.","Single national transport pass at €60 a month (€30 for under-26s), in force since January 2026."],
  ["D","En el debate de PIMEC todos los candidatos, también Hereu, pidieron más inversión en Rodalies y el corredor mediterráneo.","Al debat de PIMEC tots els candidats, també Hereu, van demanar més inversió a Rodalies i el corredor mediterrani.","At the PIMEC debate all candidates, Hereu included, called for more investment in Rodalies and the Mediterranean corridor."]],
 inmigracion:[["D","Regularización extraordinaria de 2026 (1.174.978 solicitudes) y reglamento que reduce el arraigo a dos años.","Regularització extraordinària del 2026 (1.174.978 sol·licituds) i reglament que redueix l'arrelament a dos anys.","The 2026 extraordinary regularisation (1,174,978 applications) and rules cutting the residence requirement to two years."],
  ["A","Nueva ley de nacionalidad y más convenios de migración circular (2023).","Nova llei de nacionalitat i més convenis de migració circular (2023).","A new nationality law and more circular-migration agreements (2023)."]],
 seguridad:[["D","Continuidad: ley de multirreincidencia en vigor desde abril de 2026 y plan contra el narcotráfico en el Campo de Gibraltar.","Continuïtat: llei de multireincidència en vigor des de l'abril del 2026 i pla contra el narcotràfic al Campo de Gibraltar.","Continuity: repeat-offender law in force since April 2026 and the anti-drug-trafficking plan for Campo de Gibraltar."]],
 justicia:[["D","Recuperar la nueva Ley de Enjuiciamiento Criminal, que da la instrucción a los fiscales, y la ley de integridad pública con una agencia anticorrupción.","Recuperar la nova Llei d'enjudiciament criminal, que dona la instrucció als fiscals, i la llei d'integritat pública amb una agència anticorrupció.","Revive the new criminal-procedure law handing investigations to prosecutors, and the public-integrity law creating an anti-corruption agency."]],
 pensiones:[["P","Blindar en la Constitución la revalorización anual de las pensiones con el IPC.","Blindar a la Constitució la revaloració anual de les pensions amb l'IPC.","Write annual inflation-linked pension rises into the Constitution."],
  ["D","Sánchez promete cuatro años más de revalorización con el IPC y acabar la legislatura con 20.000 millones en el Fondo de Reserva.","Sánchez promet quatre anys més de revaloració amb l'IPC i acabar la legislatura amb 20.000 milions al Fons de Reserva.","Sánchez pledges four more years of inflation-linked rises and €20bn in the Reserve Fund by the end of the term."]],
 igualdad:[["P","Nueva prestación de cuatro semanas, retribuida al 100 % de la base reguladora, para cuidar a hijos menores de ocho años.","Nova prestació de quatre setmanes, retribuïda al 100 % de la base reguladora, per tenir cura de fills menors de vuit anys.","A new four-week benefit, paid at 100% of the contribution base, to care for children under eight."],
  ["P","Crear la «unión de amistad»: reconocimiento legal de relaciones de cuidados entre personas sin vínculo familiar ni de pareja.","Crear la «unió d'amistat»: reconeixement legal de relacions de cures entre persones sense vincle familiar ni de parella.","Create a \"friendship union\": legal recognition of caring relationships between people who are neither family nor a couple."],
  ["P","Blindar en la Constitución el derecho al aborto.","Blindar a la Constitució el dret a l'avortament.","Write the right to abortion into the Constitution."],
  ["D","Aprobar la ley de violencia vicaria.","Aprovar la llei de violència vicària.","Pass the vicarious-violence law."],
  ["A","Abolir la prostitución castigando el proxenetismo y ley integral contra la trata (2023).","Abolir la prostitució castigant el proxenetisme i llei integral contra el tràfic de persones (2023).","Abolish prostitution by punishing pimping, plus a comprehensive anti-trafficking law (2023)."]],
 exterior:[["D","Gasto en defensa en torno al 2 % del PIB sin asumir el 5 % de la OTAN; embargo de armas a Israel y petición de suspender el acuerdo UE-Israel.","Despesa en defensa al voltant del 2 % del PIB sense assumir el 5 % de l'OTAN; embargament d'armes a Israel i petició de suspendre l'acord UE-Israel.","Defence spending around 2% of GDP without accepting NATO's 5%; arms embargo on Israel and a call to suspend the EU–Israel agreement."],
  ["A","Apoyo a Ucrania y a su ingreso en la UE; 0,7 % de ayuda al desarrollo en 2030 (2023).","Suport a Ucraïna i al seu ingrés a la UE; 0,7 % d'ajuda al desenvolupament el 2030 (2023).","Support for Ukraine and its EU accession; 0.7% development aid by 2030 (2023)."]]
 }},
{id:"junts",short:"Junts",name:"Junts per Catalunya (JxCat)",color:"#18b5ad",head:"Míriam Nogueras",nat:"",status:"none",q:"Junts Nogueras",
 doc:["Sin programa publicado para el 29N. Las posiciones proceden de iniciativas y votaciones de 2025-2026, declaraciones de la candidata y el programa de 2023.","Sense programa publicat per al 29N. Les posicions provenen d'iniciatives i votacions del 2025-2026, declaracions de la candidata i el programa del 2023.","No programme published for 29N. Positions come from 2025-2026 bills and votes, the candidate's statements and the 2023 programme."],
 about:["Partido independentista catalán. Lema: «Catalunya al centre». Nogueras descarta investir un gobierno de PP y Vox y uno del PSOE con Ada Colau de ministra, y se abre a investir a un socialista que no sea Sánchez a cambio, entre otras cosas, del concierto económico.","Partit independentista català. Lema: «Catalunya al centre». Nogueras descarta investir un govern de PP i Vox i un del PSOE amb Ada Colau de ministra, i s'obre a investir un socialista que no sigui Sánchez a canvi, entre altres coses, del concert econòmic.","Catalan pro-independence party. Slogan: \"Catalunya al centre\". Nogueras rules out backing a PP–Vox government or a PSOE one with Ada Colau as minister, and is open to backing a Socialist other than Sánchez in exchange for, among other things, a Basque-style fiscal agreement."],
 links:[[WEB,"https://junts.cat/"],[AGG,"https://www.politicaelectoral.com/es/espana/generales-2026/nacional/junts"]],
 props:{
 vivienda:[["D","Votó contra los decretos de vivienda del Gobierno y registró uno alternativo: prórrogas voluntarias de hasta dos años, deducción del 15 % del alquiler en el IRPF e IVA del 5 % en obra nueva para residencia habitual.","Va votar contra els decrets d'habitatge del Govern i en va registrar un d'alternatiu: pròrrogues voluntàries de fins a dos anys, deducció del 15 % del lloguer a l'IRPF i IVA del 5 % en obra nova per a residència habitual.","Voted against the government's housing decrees and tabled an alternative: voluntary lease extensions of up to two years, a 15% income-tax deduction for rent and 5% VAT on new-build main homes."],
  ["D","Desalojo cautelar en 48 horas de ocupantes sin título.","Desallotjament cautelar en 48 hores d'ocupants sense títol.","Precautionary eviction within 48 hours of occupants without legal title."]],
 economia:[["D","Deflactar el IRPF, suprimir Sucesiones en línea directa y eximir de IVA a autónomos que facturen menos de 85.000 €.","Deflactar l'IRPF, suprimir Successions en línia directa i eximir d'IVA els autònoms que facturin menys de 85.000 €.","Index income tax to inflation, scrap inheritance tax in direct line and exempt self-employed people billing under €85,000 from VAT."],
  ["D","Que la Generalitat recaude todos los impuestos de Cataluña, con el concierto económico como modelo.","Que la Generalitat recapti tots els impostos de Catalunya, amb el concert econòmic com a model.","Have the Catalan government collect all taxes paid in Catalonia, on the Basque fiscal-agreement model."]],
 trabajo:[["D","En el debate de PIMEC criticó el aumento de las bajas laborales por su efecto en pymes y autónomos.","Al debat de PIMEC va criticar l'augment de les baixes laborals pel seu efecte en pimes i autònoms.","At the PIMEC debate criticised the rise in sick leave for its effect on small firms and the self-employed."],
  ["A","Salario mínimo catalán de 1.319 € (programa de 2023).","Salari mínim català de 1.319 € (programa del 2023).","A Catalan minimum wage of €1,319 (2023 programme)."]],
 sanidad:[["D","Más financiación para la sanidad catalana y defensa de la red concertada; se opuso a la ley de gestión pública.","Més finançament per a la sanitat catalana i defensa de la xarxa concertada; es va oposar a la llei de gestió pública.","More funding for Catalan healthcare and defence of the contracted network; opposed the public-management bill."],
  ["A","Traspaso de los hospitales Vall d'Hebron, Bellvitge y Trueta a la Generalitat (2023).","Traspàs dels hospitals Vall d'Hebron, Bellvitge i Trueta a la Generalitat (2023).","Transfer of Vall d'Hebron, Bellvitge and Trueta hospitals to the Catalan government (2023)."]],
 educacion:[["D","Reforzar la inmersión en catalán y rechazar las sentencias que fijan un 25 % de clases en castellano.","Reforçar la immersió en català i rebutjar les sentències que fixen un 25 % de classes en castellà.","Strengthen Catalan immersion and reject rulings requiring 25% of teaching in Spanish."],
  ["A","Financiación estatal del 0-3 y traspaso de las becas universitarias (2023).","Finançament estatal del 0-3 i traspàs de les beques universitàries (2023).","State funding for ages 0–3 and transfer of university grants (2023)."]],
 ciencia:[["A","Subir la inversión universitaria del 0,40 % al 0,60 % del PIB en cinco años (2023).","Apujar la inversió universitària del 0,40 % al 0,60 % del PIB en cinc anys (2023).","Raise university funding from 0.40% to 0.60% of GDP within five years (2023)."]],
 energia:[["D","Apoya la transición energética; se abstuvo en 2025 en las votaciones sobre el calendario de cierre nuclear.","Dona suport a la transició energètica; es va abstenir el 2025 a les votacions sobre el calendari de tancament nuclear.","Backs the energy transition; abstained in the 2025 votes on the nuclear closure timetable."]],
 territorial:[["D","Independencia por la vía de la autodeterminación; rechazó el modelo de financiación pactado en enero de 2026.","Independència per la via de l'autodeterminació; va rebutjar el model de finançament pactat el gener del 2026.","Independence through self-determination; rejected the financing model agreed in January 2026."],
  ["D","Oficialidad del catalán en la Unión Europea.","Oficialitat del català a la Unió Europea.","Official status for Catalan in the European Union."]],
 infra:[["D","Traspaso integral de Rodalies: vías, trenes, estaciones y recursos.","Traspàs integral de Rodalies: vies, trens, estacions i recursos.","Full transfer of Rodalies: tracks, trains, stations and funding."],
  ["A","Traspaso de aeropuertos y puertos catalanes (2023).","Traspàs d'aeroports i ports catalans (2023).","Transfer of Catalan airports and ports (2023)."]],
 inmigracion:[["D","Competencias plenas de inmigración para Cataluña: permisos, expulsiones y control en puertos y aeropuertos.","Competències plenes d'immigració per a Catalunya: permisos, expulsions i control a ports i aeroports.","Full immigration powers for Catalonia: permits, removals and port and airport control."],
  ["D","Exigir catalán A2 para renovar permisos y B1 para el arraigo; diez años de padrón para vivienda protegida.","Exigir català A2 per renovar permisos i B1 per a l'arrelament; deu anys de padró per a habitatge protegit.","Require A2 Catalan to renew permits and B1 for settlement; ten years' registration for protected housing."]],
 seguridad:[["D","Reivindica como propia la ley de multirreincidencia de 2026.","Reivindica com a pròpia la llei de multireincidència del 2026.","Claims credit for the 2026 repeat-offender law."],
  ["D","Mossos d'Esquadra como policía integral, también en puertos y aeropuertos.","Mossos d'Esquadra com a policia integral, també a ports i aeroports.","Mossos d'Esquadra as the full police force, including at ports and airports."]],
 justicia:[["D","Aplicación plena de la amnistía, incluido Carles Puigdemont.","Aplicació plena de l'amnistia, inclòs Carles Puigdemont.","Full application of the amnesty, including to Carles Puigdemont."],
  ["A","Crear el Consell de Justícia de Catalunya (2023).","Crear el Consell de Justícia de Catalunya (2023).","Create a Catalan Justice Council (2023)."]],
 pensiones:[["D","Revalorizar las pensiones con el IPC en una ley propia, sin mezclarla con otras medidas.","Revalorar les pensions amb l'IPC en una llei pròpia, sense barrejar-la amb altres mesures.","Raise pensions with inflation through a stand-alone law, not bundled with other measures."],
  ["A","Tener en cuenta el coste de la vida de cada territorio (2023).","Tenir en compte el cost de la vida de cada territori (2023).","Factor in each territory's cost of living (2023)."]],
 igualdad:[["A","Ley de corresponsabilidad con permisos intransferibles y equiparar las familias monoparentales a las numerosas (2023).","Llei de corresponsabilitat amb permisos intransferibles i equiparar les famílies monoparentals a les nombroses (2023).","A shared-responsibility law with non-transferable leave, and single-parent families treated like large families (2023)."]],
 exterior:[["A","Reconocimiento del derecho de autodeterminación en la UE (2023).","Reconeixement del dret d'autodeterminació a la UE (2023).","EU recognition of the right to self-determination (2023)."]]
 }},
{id:"erc",short:"ERC",name:"Esquerra Republicana de Catalunya (ERC)",color:"#f3a712",head:"Gabriel Rufián",nat:"",status:"pub",q:"ERC Rufián",
 doc:["«Eleccions al Congrés 2026. Programa electoral», 48 páginas en catalán, presentado el 5 de noviembre.","«Eleccions al Congrés 2026. Programa electoral», 48 pàgines en català, presentat el 5 de novembre.","\"Eleccions al Congrés 2026. Programa electoral\", 48 pages in Catalan, presented on 5 November."],
 about:["Partido independentista de izquierdas. Lema de campaña: «Defensa't». Acordó con Podemos que este no se presente en Cataluña y que la lista de ERC incluya a personas de su entorno; el programa y el grupo parlamentario son de ERC.","Partit independentista d'esquerres. Lema de campanya: «Defensa't». Va acordar amb Podem que aquest no es presenti a Catalunya i que la llista d'ERC inclogui persones del seu entorn; el programa i el grup parlamentari són d'ERC.","Left-wing pro-independence party. Campaign slogan: \"Defensa't\". Agreed with Podemos that the latter would not run in Catalonia and that ERC's list would include people close to it; the programme and parliamentary group are ERC's."],
 links:[[WEB,"https://www.esquerra.cat/"],[["Programa de 2023 (PDF)","Programa del 2023 (PDF)","2023 programme (PDF)"],"https://static.esquerra.cat/uploads/20230905/e2023-programa.pdf"],[AGG,"https://www.politicaelectoral.com/es/espana/generales-2026/nacional/erc"]],
 props:{
 vivienda:[["P","Delegar en Cataluña la capacidad de aprobar una ley propia de arrendamientos urbanos.","Delegar a Catalunya la capacitat d'aprovar una llei pròpia d'arrendaments urbans.","Delegate to Catalonia the power to pass its own urban-leasing law."],
  ["P","Destinar al menos el 1,5 % del PIB a vivienda en los presupuestos del Estado y traspasar gratis los pisos de la Sareb y Casa 47.","Destinar almenys l'1,5 % del PIB a habitatge als pressupostos de l'Estat i traspassar gratis els pisos de la Sareb i Casa 47.","Put at least 1.5% of GDP into housing in state budgets and transfer Sareb and Casa 47 homes free of charge."],
  ["P","IVA del 21 % al alquiler turístico y más impuestos a viviendas turísticas, segundas residencias y vacías; sin desahucios de personas vulnerables sin alternativa.","IVA del 21 % al lloguer turístic i més impostos a habitatges turístics, segones residències i buits; sense desnonaments de persones vulnerables sense alternativa.","21% VAT on tourist rentals and higher taxes on tourist, second and empty homes; no evictions of vulnerable people without an alternative."]],
 economia:[["P","Aplicar el modelo de financiación acordado en enero de 2026 (unos 4.700 millones más al año) con la Agència Tributària de Catalunya recaudando todos los impuestos.","Aplicar el model de finançament acordat el gener del 2026 (uns 4.700 milions més l'any) amb l'Agència Tributària de Catalunya recaptant tots els impostos.","Apply the financing model agreed in January 2026 (about €4.7bn more a year) with the Catalan tax agency collecting all taxes."],
  ["P","Subir del 30 % al 35 % el tipo máximo sobre rentas del capital y bajar el IRPF a rentas del trabajo inferiores a 35.000 €.","Apujar del 30 % al 35 % el tipus màxim sobre rendes del capital i abaixar l'IRPF a rendes del treball inferiors a 35.000 €.","Raise the top rate on capital income from 30% to 35% and cut income tax on earnings below €35,000."],
  ["P","Hacer permanentes los impuestos a grandes fortunas y banca, recuperar el de las energéticas y derogar la «ley Beckham».","Fer permanents els impostos a grans fortunes i banca, recuperar el de les energètiques i derogar la «llei Beckham».","Make the wealth and bank taxes permanent, restore the energy-company levy and repeal the \"Beckham law\"."]],
 trabajo:[["P","Salario mínimo en el 60 % del salario medio bruto y un salario mínimo catalán de 1.460 €.","Salari mínim en el 60 % del salari mitjà brut i un salari mínim català de 1.460 €.","Minimum wage at 60% of the average gross wage, plus a Catalan minimum wage of €1,460."],
  ["P","Jornada de 37,5 horas sin rebaja salarial y recuperar los 45 días por despido improcedente.","Jornada de 37,5 hores sense rebaixa salarial i recuperar els 45 dies per acomiadament improcedent.","A 37.5-hour week with no pay cut and a return to 45 days' severance for unfair dismissal."]],
 sanidad:[["P","Incluir en la cartera pública la atención dental gratuita, gafas y lentillas financiadas y psicoterapia gratuita, a cargo del Estado.","Incloure a la cartera pública l'atenció dental gratuïta, ulleres i lents de contacte finançades i psicoteràpia gratuïta, a càrrec de l'Estat.","Add free dental care, subsidised glasses and contact lenses and free psychotherapy to public coverage, paid by the State."],
  ["P","Reducir listas de espera, frenar la privatización y más financiación estatal para plantillas y primaria.","Reduir llistes d'espera, frenar la privatització i més finançament estatal per a plantilles i primària.","Cut waiting lists, halt privatisation and increase state funding for staff and primary care."]],
 educacion:[["P","Blindar la inmersión con el catalán como lengua vehicular y competencia exclusiva sobre el currículo.","Blindar la immersió amb el català com a llengua vehicular i competència exclusiva sobre el currículum.","Protect immersion with Catalan as the teaching language and exclusive powers over the curriculum."],
  ["P","Subir el gasto educativo al 6 % del PIB y 0-3 público, universal y gratuito con fondos estatales.","Apujar la despesa educativa al 6 % del PIB i 0-3 públic, universal i gratuït amb fons estatals.","Raise education spending to 6% of GDP and make 0–3 schooling public, universal and free with state funds."]],
 ciencia:[["P","Elevar la inversión en investigación al 1,5 % del PIB y la universitaria al 1 % en 2030.","Elevar la inversió en recerca a l'1,5 % del PIB i la universitària a l'1 % el 2030.","Raise research spending to 1.5% of GDP and university funding to 1% by 2030."],
  ["P","Suprimir el distrito único universitario y que la agencia catalana AQU asuma las funciones de la ANECA.","Suprimir el districte únic universitari i que l'agència catalana AQU assumeixi les funcions de l'ANECA.","Abolish the single university admissions district and have the Catalan agency AQU take over ANECA's functions."]],
 energia:[["P","Reducir las emisiones de CO2 al menos un 65 % en 2030 y un 95 % en 2040; sistema 100 % renovable y descentralizado.","Reduir les emissions de CO2 almenys un 65 % el 2030 i un 95 % el 2040; sistema 100 % renovable i descentralitzat.","Cut CO2 emissions by at least 65% by 2030 and 95% by 2040; a 100% renewable, decentralised system."],
  ["P","4.000 puntos de carga rápida antes de 2030 y autoconsumo compartido hasta 10 km (20 km en zonas rurales).","4.000 punts de càrrega ràpida abans del 2030 i autoconsum compartit fins a 10 km (20 km en zones rurals).","4,000 fast-charging points before 2030 and shared self-consumption up to 10 km (20 km in rural areas)."]],
 territorial:[["P","Negociar un referéndum de autodeterminación con facilitación internacional de la UE y el Consejo de Europa.","Negociar un referèndum d'autodeterminació amb facilitació internacional de la UE i el Consell d'Europa.","Negotiate a self-determination referendum with international facilitation by the EU and Council of Europe."],
  ["P","Ley de plurilingüismo y oficialidad del catalán en la UE; traspaso de la Inspección de Trabajo y las prestaciones de paro.","Llei de plurilingüisme i oficialitat del català a la UE; traspàs de la Inspecció de Treball i les prestacions d'atur.","A multilingualism law and official EU status for Catalan; transfer of the Labour Inspectorate and unemployment benefits."]],
 infra:[["P","Completar el traspaso de la línea R1 de Rodalies.","Completar el traspàs de la línia R1 de Rodalies.","Complete the transfer of the Rodalies R1 line."],
  ["P","Que el Estado pague 435 millones por las desaladoras de la Tordera y el Foix.","Que l'Estat pagui 435 milions per les dessalinitzadores de la Tordera i el Foix.","Have the State pay €435m for the Tordera and Foix desalination plants."]],
 inmigracion:[["P","Traspasar a Cataluña todas las competencias de migración y asilo, con enfoque de derechos humanos.","Traspassar a Catalunya totes les competències de migració i asil, amb enfocament de drets humans.","Transfer all migration and asylum powers to Catalonia, with a human-rights approach."],
  ["P","Rechazo a los centros de retorno en terceros países y vías legales y seguras de migración.","Rebuig als centres de retorn a tercers països i vies legals i segures de migració.","Reject return centres in third countries; open legal and safe migration routes."]],
 seguridad:[["P","Mossos como única policía en toda Cataluña, incluidos puertos y aeropuertos, y control pleno del tráfico.","Mossos com a única policia a tot Catalunya, inclosos ports i aeroports, i control ple del trànsit.","Mossos as the sole police force across Catalonia, including ports and airports, with full control of traffic."],
  ["P","Más penas por tenencia ilegal de armas y robo de cable; 180 nuevas plazas de juez; derogar la «ley mordaza».","Més penes per tinença il·legal d'armes i robatori de cable; 180 noves places de jutge; derogar la «llei mordassa».","Tougher penalties for illegal weapons and cable theft; 180 new judge posts; repeal the \"gag law\"."]],

var BALLOTS=[
 {sen:0,t:["Congreso de los Diputados","Congrés dels Diputats","Congress of Deputies"],k:["Papeleta blanca","Papereta blanca","White ballot"],
  f:[["350 diputados en toda España; Barcelona elige 32.","350 diputats a tot Espanya; Barcelona en tria 32.","350 deputies nationwide; Barcelona elects 32."],
     ["Votas a un partido: coges su papeleta y la metes en el sobre, sin marcar nada.","Votes un partit: agafes la seva papereta i la poses al sobre, sense marcar res.","You vote for a party: take its ballot and put it in the envelope, without marking anything."],
     ["La lista es cerrada y bloqueada: no puedes elegir personas ni cambiar el orden.","La llista és tancada i bloquejada: no pots triar persones ni canviar l'ordre.","The list is closed and fixed: you cannot pick individuals or change the order."],

 {sen:1,t:["Senado","Senat","Senate"],k:["Papeleta sepia","Papereta sèpia","Sepia ballot"],

var HOW=[
 {h:["Dos votos independientes","Dos vots independents","Two independent votes"],p:[
  ["En la mesa entregas dos sobres, uno para cada cámara. Lo que votes en uno no condiciona el otro: puedes elegir un partido para el Congreso y candidatos de otros partidos para el Senado.","A la mesa lliures dos sobres, un per a cada cambra. El que votis en un no condiciona l'altre: pots triar un partit per al Congrés i candidats d'altres partits per al Senat.","At the polling table you hand in two envelopes, one per chamber. One vote does not constrain the other: you can choose one party for Congress and candidates from other parties for the Senate."],
  ["También puedes votar solo en una de las dos elecciones.","També pots votar només en una de les dues eleccions.","You may also vote in just one of the two elections."]]},
 {h:["Para qué sirve cada cámara","Per a què serveix cada cambra","What each chamber does"],p:[
  ["El Congreso elige al presidente del Gobierno en la investidura y puede hacerlo caer. Tramita primero las leyes y los presupuestos y tiene la última palabra sobre las enmiendas y vetos del Senado.","El Congrés tria el president del Govern a la investidura i el pot fer caure. Tramita primer les lleis i els pressupostos i té l'última paraula sobre les esmenes i vetos del Senat.","Congress elects the prime minister at the investiture vote and can bring the government down. It handles laws and budgets first and has the final say over Senate amendments and vetoes."],
  ["Para la investidura hace falta mayoría absoluta (176 de 350) en la primera votación, o más síes que noes en la segunda, 48 horas después.","Per a la investidura cal majoria absoluta (176 de 350) a la primera votació, o més sís que nos a la segona, 48 hores després.","Investiture needs an absolute majority (176 of 350) in the first vote, or more yes than no votes in the second, 48 hours later."],
  ["El Senado es la cámara territorial: revisa las leyes que le llegan del Congreso, puede enmendarlas o vetarlas, y debe autorizar medidas excepcionales sobre una comunidad autónoma (artículo 155). No participa en la elección del presidente.","El Senat és la cambra territorial: revisa les lleis que li arriben del Congrés, les pot esmenar o vetar, i ha d'autoritzar mesures excepcionals sobre una comunitat autònoma (article 155). No participa en l'elecció del president.","The Senate is the territorial chamber: it reviews laws sent from Congress, may amend or veto them, and must authorise exceptional measures over a region (Article 155). It plays no part in electing the prime minister."]]},
 {h:["Cómo se reparten los 32 escaños del Congreso por Barcelona","Com es reparteixen els 32 escons del Congrés per Barcelona","How Barcelona's 32 Congress seats are shared out"],ex:1,p:[
  ["Cada provincia es una circunscripción: tu voto solo compite con los de la provincia de Barcelona.","Cada província és una circumscripció: el teu vot només competeix amb els de la província de Barcelona.","Each province is a constituency: your vote only competes with others cast in the province of Barcelona."],
  ["Solo entran en el reparto las candidaturas con al menos el 3 % de los votos válidos de la provincia.","Només entren en el repartiment les candidatures amb almenys el 3 % dels vots vàlids de la província.","Only candidatures with at least 3% of the province's valid votes take part in the allocation."],
  ["Los escaños se asignan con el método D'Hondt, que favorece ligeramente a las candidaturas más votadas. Salen elegidas las personas de cada lista por orden, empezando por la primera.","Els escons s'assignen amb el mètode D'Hondt, que afavoreix lleugerament les candidatures més votades. Surten elegides les persones de cada llista per ordre, començant per la primera.","Seats are assigned by the D'Hondt method, which slightly favours the most-voted candidatures. People on each list are elected in order, starting from the top."]]},
 {h:["Cómo se eligen los 4 senadores por Barcelona","Com es trien els 4 senadors per Barcelona","How Barcelona's 4 senators are chosen"],p:[
  ["Cada partido presenta hasta tres candidatos. En la papeleta sepia aparecen todos; pon una cruz en la casilla de los que elijas, hasta tres.","Cada partit presenta fins a tres candidats. A la papereta sèpia hi apareixen tots; posa una creu a la casella dels que triïs, fins a tres.","Each party fields up to three candidates. All appear on the sepia ballot; put a cross in the box of those you choose, up to three."],
  ["Se cuentan los votos de cada persona, no de cada partido, y obtienen escaño los cuatro más votados.","Es compten els vots de cada persona, no de cada partit, i obtenen escó els quatre més votats.","Votes are counted per person, not per party, and the four most-voted candidates win a seat."],
  ["Como cada votante marca tres y hay cuatro escaños, lo habitual es que el partido más votado se lleve tres y el segundo, uno. En 2023 fueron tres para el PSC y uno para ERC.","Com que cada votant en marca tres i hi ha quatre escons, l'habitual és que el partit més votat se n'endugui tres i el segon, un. El 2023 van ser tres per al PSC i un per a ERC.","Because each voter marks three and there are four seats, the most-voted party usually takes three and the runner-up one. In 2023 it was three for PSC and one for ERC."],
  ["Por eso las listas conjuntas importan más en el Senado que en el Congreso: quedar primero vale mucho más que quedar segundo.","Per això les llistes conjuntes importen més al Senat que al Congrés: quedar primer val molt més que quedar segon.","That is why joint lists matter more for the Senate than for Congress: finishing first is worth far more than finishing second."]]},
 {h:["Voto válido, en blanco y nulo","Vot vàlid, en blanc i nul","Valid, blank and spoiled votes"],p:[
  ["En blanco: un sobre vacío para el Congreso, o la papeleta del Senado sin ninguna cruz. Es un voto válido: no va a ningún partido, pero cuenta en el total sobre el que se calcula el 3 %.","En blanc: un sobre buit per al Congrés, o la papereta del Senat sense cap creu. És un vot vàlid: no va a cap partit, però compta en el total sobre el qual es calcula el 3 %.","Blank: an empty envelope for Congress, or the Senate ballot with no cross. It is a valid vote: it goes to no party, but counts in the total used to calculate the 3% threshold."],
  ["Nulo: papeletas de candidaturas distintas en el mismo sobre, una papeleta del Congreso con nombres tachados, cambiados o reordenados, o más de tres cruces en la del Senado. No cuenta para nada.","Nul: paperetes de candidatures diferents al mateix sobre, una papereta del Congrés amb noms ratllats, canviats o reordenats, o més de tres creus a la del Senat. No compta per a res.","Spoiled: ballots from different candidatures in one envelope, a Congress ballot with names crossed out, changed or reordered, or more than three crosses on the Senate ballot. It counts for nothing."],
  ["Varias papeletas de la misma candidatura en un sobre cuentan como un solo voto válido.","Diverses paperetes de la mateixa candidatura en un sobre compten com un sol vot vàlid.","Several ballots of the same candidature in one envelope count as a single valid vote."],
  ["Abstenerse es no votar: no se contabiliza como voto de ningún tipo.","Abstenir-se és no votar: no es comptabilitza com a vot de cap mena.","Abstaining means not voting: it is not counted as a vote of any kind."]]},
 {h:["El día de la votación","El dia de la votació","On election day"],p:[
  ["Lleva un documento original con fotografía que te identifique: DNI, pasaporte o permiso de conducir.","Porta un document original amb fotografia que t'identifiqui: DNI, passaport o permís de conduir.","Bring an original photo document that identifies you: national ID card, passport or driving licence."],
  ["Tu colegio y tu mesa figuran en la tarjeta censal que llega a casa; el horario y la consulta de mesa están en la web oficial del INE, enlazada en la pestaña Agenda.","El teu col·legi i la teva mesa figuren a la targeta censal que arriba a casa; l'horari i la consulta de mesa són al web oficial de l'INE, enllaçat a la pestanya Agenda.","Your polling place and table are on the census card posted to you; opening hours and the table lookup are on the official INE site, linked in the Calendar tab."],
  ["Puedes llevar las papeletas preparadas de casa (las que envían los partidos sirven) o cogerlas en el colegio y prepararlas en la cabina.","Pots portar les paperetes preparades de casa (les que envien els partits serveixen) o agafar-les al col·legi i preparar-les a la cabina.","You can bring ballots ready from home (those mailed by parties are valid) or pick them up at the polling place and prepare them in the booth."]]},
 {h:["Y después","I després","What happens next"],p:[
  ["La noche del 29 se conocen los resultados provisionales. Las nuevas Cortes se constituyen el 23 de diciembre.","La nit del 29 es coneixen els resultats provisionals. Les noves Corts es constitueixen el 23 de desembre.","Provisional results come on the night of the 29th. The new parliament convenes on 23 December."],
  ["Después el Rey consulta a los grupos y propone un candidato, y el Congreso vota la investidura. Si nadie la supera en los dos meses siguientes a la primera votación, se repiten las elecciones.","Després el Rei consulta els grups i proposa un candidat, i el Congrés vota la investidura. Si ningú la supera en els dos mesos següents a la primera votació, es repeteixen les eleccions.","The King then consults the parties and proposes a candidate, and Congress votes on the investiture. If no one succeeds within two months of the first vote, the election is repeated."]]}
];

HOW.push({h:["Por qué no salen los mismos partidos en todas partes","Per què no surten els mateixos partits a tot arreu","Why the parties are not the same everywhere"],p:[
 ["España se divide en 52 circunscripciones (las 50 provincias, Ceuta y Melilla) y cada una tiene sus propias papeletas. Tu voto solo cuenta en la tuya.","Espanya es divideix en 52 circumscripcions (les 50 províncies, Ceuta i Melilla) i cadascuna té les seves pròpies paperetes. El teu vot només compta a la teva.","Spain is divided into 52 constituencies (the 50 provinces, Ceuta and Melilla), each with its own ballots. Your vote only counts in your own."],
 ["Cada candidatura se presenta provincia a provincia ante la Junta Electoral Provincial. Ningún partido está obligado a presentarse en todas.","Cada candidatura es presenta província a província davant la Junta Electoral Provincial. Cap partit està obligat a presentar-se a totes.","Each candidature is filed province by province with the Provincial Electoral Board. No party is obliged to run everywhere."],
 ["Hay partidos de ámbito territorial que solo concurren en su territorio: por eso ERC y Junts están en las papeletas de Cataluña y no en las de Madrid.","Hi ha partits d'àmbit territorial que només concorren al seu territori: per això ERC i Junts són a les paperetes de Catalunya i no a les de Madrid.","Territorial parties only run in their own territory: that is why ERC and Junts are on ballots in Catalonia and not in Madrid."],
 ["Los partidos, federaciones y coaliciones sin representación en ninguna de las dos cámaras necesitan la firma de al menos el 0,1 % de los electores de la circunscripción; las agrupaciones de electores, el 1 %. Una coalición queda exenta si uno de sus partidos ya tiene representación (LOREG, art. 169.3, e Instrucción 7/2011 de la JEC).","Els partits, federacions i coalicions sense representació en cap de les dues cambres necessiten la signatura d'almenys el 0,1 % dels electors de la circumscripció; les agrupacions d'electors, l'1 %. Una coalició en queda exempta si un dels seus partits ja té representació (LOREG, art. 169.3, i Instrucció 7/2011 de la JEC).","Parties, federations and coalitions with no seats in either chamber need signatures from at least 0.1% of the constituency's voters; groupings of electors need 1%. A coalition is exempt if one of its member parties already has seats (LOREG, art. 169.3, and JEC Instruction 7/2011)."],
 ["Los pactos también cuentan: el 29N Podemos no presenta lista propia en Cataluña y va dentro de la de ERC. Iustitia Europa solo se presenta por Madrid.","Els pactes també compten: el 29N Podem no presenta llista pròpia a Catalunya i va dins de la d'ERC. Iustitia Europa només es presenta per Madrid.","Deals matter too: on 29N Podemos files no list of its own in Catalonia and runs within ERC's. Iustitia Europa is only running in Madrid."],
 ["La Junta Electoral revisa cada lista y solo las proclamadas llegan a la papeleta. En Barcelona hay 11 candidaturas proclamadas al Congreso.","La Junta Electoral revisa cada llista i només les proclamades arriben a la papereta. A Barcelona hi ha 11 candidatures proclamades al Congrés.","The electoral board checks each list and only proclaimed ones reach the ballot. Barcelona has 11 proclaimed Congress candidatures."]]});

function vlist(a){return '<ul class="src" style="margin-top:8px">'+a.map(function(v){return '<li><span class="pill no" style="margin-right:6px">'+esc(t(KIND[v[0]]))+'</span><a href="'+esc(v[2])+'" target="_blank" rel="noopener">'+esc(v[1])+'</a></li>';}).join('')+'</ul>';}
function plain(a){return '<ul class="src" style="margin-top:8px">'+a.map(function(v){return '<li><a href="'+esc(v[1])+'" target="_blank" rel="noopener">'+esc(v[0])+'</a> <span style="color:var(--muted)">· '+esc(v[2])+'</span></li>';}).join('')+'</ul>';}
function vbtn(p,x){if(!(p.props[x.id]||[]).length)return '';return '<div class="links"><button type="button" class="btn solid vb" data-video="'+p.id+'-'+x.id+'">\u25B6 '+esc(t(UI.vid.play))+'</button></div><div class="vslot"></div>';}

function render(){
  var r=route();
  document.documentElement.lang=['es','ca','en'][L];
  document.getElementById('t-title').textContent=t(UI.title);
  document.getElementById('t-sub').textContent=t(UI.sub);
  document.getElementById('foot').textContent=t(UI.foot);
  document.getElementById('nav').innerHTML=ROUTES.map(function(k){return '<a href="#'+k+'"'+(k===r?' aria-current="page"':'')+'>'+esc(t(UI.nav[k]))+'</a>';}).join('');
  try{var cur=document.querySelector('#nav [aria-current]');if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:'nearest',inline:'center'});}catch(x){}
  [0,1,2].forEach(function(i){document.querySelector('.lang button[data-l="'+i+'"]').setAttribute('aria-pressed',String(i===L));});
  document.getElementById('view').innerHTML=V[r]();
}
document.addEventListener('click',function(e){
  var b=e.target.closest('button,a');if(!b)return;
  if(b.dataset.l!==undefined){L=+b.dataset.l;try{localStorage.setItem('g29n-lang',String(L));}catch(x){}render();return;}
  if(b.dataset.video){var host=b.closest('.vhost'),slot=host&&host.querySelector('.vslot');if(slot){slot.innerHTML='<video class="vid" controls autoplay playsinline src="videos/'+b.dataset.video+'-'+['es','ca','en'][L]+'.mp4"></video>';}return;}
  if(b.dataset.go){st.party=b.dataset.go;return;}
  if(b.dataset.party){if(route()==='temas'){st.off[b.dataset.party]=!st.off[b.dataset.party];}else{st.party=b.dataset.party;}render();return;}
  if(b.dataset.topic){st.topic=b.dataset.topic;render();return;}
  if(b.dataset.kind!==undefined){st.kind=b.dataset.kind;render();return;}
});
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0);});
render();
})();
